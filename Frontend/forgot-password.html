<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Invoxen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="" aria-hidden="true">
      <span>Invoxen</span>
    </a>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="extraction.html">Extraction</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="insights.html">Insights</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <main class="auth-shell">
    <section class="auth-panel">
      <p class="eyebrow">Password recovery</p>
      <h1>Reset access to your Invoxen workspace.</h1>
      <p>
        Enter the email used for your account and Invoxen will guide you through restoring access.
      </p>
    </section>

    <section class="card login-card" aria-label="Password reset form">
      <h1>Reset password</h1>
      <p class="signup-link">Remembered it? <a href="login.html">Back to sign in</a></p>

      <form>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

        <button class="button primary" type="submit">Send reset link</button>
      </form>
    </section>
  </main>
</body>
</html>
